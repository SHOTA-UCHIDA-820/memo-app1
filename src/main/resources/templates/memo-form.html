<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${memo.id} == null) ? '新規メモ作成' : 'メモ編集'">メモ作成/編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="(${memo.id} == null) ? '新規メモ作成' : 'メモ編集'">メモ作成/編集</h2>
    <form th:action="(${memo.id} == null) ? @{/memos} : @{/memos/{id}/edit(id=${memo.id})}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">タイトル</label>
            <input type="text" id="title" name="title" th:value="${memo.title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">内容</label>
            <textarea id="content" name="content" rows="5" class="form-control" required
                      th:text="${memo.content}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">タグ</label><br>
            <div th:each="tag : ${tags}" class="form-check form-check-inline">
                <input type="checkbox" name="tagIds" th:value="${tag.id}"
                       th:checked="${memo.tags.contains(tag)}" class="form-check-input">
                <label th:text="${tag.name}" class="form-check-label"></label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a th:href="@{/memos}" class="btn btn-secondary">戻る</a>
    </form>
</div>
</body>
</html>
