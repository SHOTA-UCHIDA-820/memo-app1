<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Memo Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<style>	
		.memo-title {
		    position: relative;
		    display: block;
		}

		.memo-title::after {
		    content: "";
		    position: absolute;
		    left: 0;
		    bottom: -22px;
		    width: 100%;
		    height: 2px;
		    background: #333;
		}

		.tag-badge {
		    background-color: #e0e7ff;
		    color: #3730a3;
		    font-size: 0.8rem;
		    padding: 4px 10px;
		    border-radius: 9999px;
		    margin-right: 5px;
		 }
		 
		 .label {
			background-color: rgb(0, 0, 0);
			color: rgb(255, 255, 255);
			font-size: 0.8rem;
			padding: 4px 10px;
			margin-right: 15px;
			display: inline-block;
			width: 70px;
			text-align: center;
		 }	 
	</style>
	
</head>
<body class="container mt-5">
	<h1 class="memo-title my-5" th:text="${memo.title}"></h1>
	<div class="d-flex mb-2">
		<div class="d-flex me-5">
			<h5><span class="label">登録日</span></h5>
			<h5 th:text="${memo.formattedCreatedAt}" style="margin-top: 3px;">2025/08/31 12:00</h5>
		</div>
		<div class="d-flex">
			<h5><span class="label">タグ</span></h5>
			<h5><span th:each="tag : ${memo.tags}" th:text="${tag.name}" class="tag-badge"></span></h5>
		</div>
	</div>
    <p class="my-4" th:text="${memo.content}"></p>
    <a href="/memos" class="btn btn-secondary">戻る</a>
</body>
</html>
