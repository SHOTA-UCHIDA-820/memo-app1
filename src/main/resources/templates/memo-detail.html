<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>メモ詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${memo.title}">タイトル</h2>
    <p th:text="${memo.content}">内容</p>
    <div>
        <span th:each="tag : ${memo.tags}" class="badge bg-secondary me-1" th:text="${tag.name}">タグ</span>
    </div>
    <div class="mt-3">
        <a th:href="@{/memos}" class="btn btn-secondary">一覧に戻る</a>
        <a th:href="@{/memos/{id}/edit(id=${memo.id})}" class="btn btn-warning">編集</a>
        <form th:action="@{/memos/{id}/delete(id=${memo.id})}" method="post" style="display:inline">
            <button type="submit" class="btn btn-danger">削除</button>
        </form>
    </div>
</div>
</body>
</html>
