<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>メモ一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>メモ一覧</h2>
    <a th:href="@{/memos/add}" class="btn btn-primary mb-3">新規作成</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>タイトル</th>
            <th>タグ</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="memo : ${memos}">
            <td th:text="${memo.title}">タイトル</td>
            <td>
                <span th:each="tag : ${memo.tags}" class="badge bg-secondary me-1" th:text="${tag.name}">タグ</span>
            </td>
            <td>
                <a th:href="@{/memos/{id}(id=${memo.id})}" class="btn btn-info btn-sm">詳細</a>
                <a th:href="@{/memos/{id}/edit(id=${memo.id})}" class="btn btn-warning btn-sm">編集</a>
                <form th:action="@{/memos/{id}/delete(id=${memo.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
